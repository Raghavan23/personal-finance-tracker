<div class="stat-card">
  <div class="card-header">
    <span class="card-title">{{ title() }}</span>
    <span class="card-icon">{{ icon() }}</span>
  </div>
  <div class="card-value">{{ value() }}</div>
  @if (subtitle()) {
    <div class="card-subtitle" [ngClass]="trend()">{{ subtitle() }}</div>
  }
</div>
